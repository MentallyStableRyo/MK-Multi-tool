[package]
name = "mk-multitool"
version = "0.6.0"
description = "Precision video slice downloader for YouTube, Instagram, TikTok, and X"
authors = ["MK"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mk_multitool_lib"
crate-type = ["lib"]

[[bin]]
name = "mk-multitool"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "time",
    "sync",
    "fs",
] }
tokio-util = "0.7"

thiserror = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
url = "2"
which = "7"
dirs = "5"
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }

# General Converter
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "webp", "bmp", "tiff", "gif", "ico",
] }
resvg = { version = "0.48", default-features = false }
usvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
tiny-skia = "0.12"
# `bind_to_library` dynamically loads the vendored pdfium at runtime (no
# `static` feature), matching the sidecar-resolution pattern used everywhere
# else in this app. `image_api` gets DynamicImage in and out of PDF pages, so
# PDF<->image conversion and image-to-PDF assembly both go through one crate.
pdfium-render = { version = "0.9", features = ["image_latest"] }

[features]
# Enabled by `tauri dev` / `tauri build` to inject the dev server URL.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.dev]
# Cuts debug-build link time substantially without hurting step-through debugging.
opt-level = 1
